<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Snakes &amp; Ladders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: board left (start strip under square 1), control column right; stacks on phones */
:root {
  --bg: #e9efe6;
  --panel: #f8fbf5;
  --ink: #1d2a22;
  --muted: #5b6b60;
  --line: #c6d3c4;
  --tile-a: #f6faf1;
  --tile-b: #d6e7d1;
  --tile-home: #f3c94b;
  --ladder: #a8682a;
  --ladder-shadow: rgba(40, 25, 10, .28);
  --accent: #2448c9;
  --accent-ink: #ffffff;
  --strip: #cfdccb;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --panel: #18211b; --ink: #e5eee6; --muted: #9db0a2; --line: #2d3b31;
    --tile-a: #1e2a22; --tile-b: #2a3a2f; --tile-home: #c99a1c; --ladder: #d08c43;
    --ladder-shadow: rgba(0,0,0,.45); --accent: #7f9bff; --accent-ink: #0d1430; --strip: #223027;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --panel: #18211b; --ink: #e5eee6; --muted: #9db0a2; --line: #2d3b31;
  --tile-a: #1e2a22; --tile-b: #2a3a2f; --tile-home: #c99a1c; --ladder: #d08c43;
  --ladder-shadow: rgba(0,0,0,.45); --accent: #7f9bff; --accent-ink: #0d1430; --strip: #223027;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.app {
  max-width: 1080px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start;
}
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* Board */
.board-wrap {
  position: relative; width: 100%; max-width: 680px; aspect-ratio: 10 / 11; margin: 0 auto;
  container-type: inline-size;
}
.board {
  position: absolute; inset: 0 0 auto 0; height: calc(100% * 10 / 11);
  display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
  border-radius: 14px; overflow: hidden; border: 3px solid var(--ink);
}
.sq {
  position: relative; background: var(--tile-a); border: .5px solid var(--line);
  font-weight: 800; font-size: 2.3cqw; color: var(--muted); padding: .5cqw .8cqw;
  font-variant-numeric: tabular-nums;
}
.sq.alt { background: var(--tile-b); }
.sq.home { background: var(--tile-home); color: var(--ink); }
.sq.home::after {
  content: "HOME"; position: absolute; left: 0; right: 0; bottom: .8cqw; text-align: center;
  font-family: var(--display); font-size: 2.1cqw; letter-spacing: .06em; color: var(--ink);
}
.sq.flash { animation: flash .6s ease-out; }
@keyframes flash { from { box-shadow: inset 0 0 0 1cqw var(--accent); } to { box-shadow: inset 0 0 0 0 transparent; } }
.overlay { position: absolute; inset: 0 0 auto 0; height: calc(100% * 10 / 11); width: 100%; pointer-events: none; }
.strip {
  position: absolute; left: 0; right: 0; bottom: 0; height: calc(100% / 11 - 1cqw);
  background: var(--strip); border-radius: 12px; display: flex; align-items: center; justify-content: flex-end;
  padding-right: 3cqw; font-family: var(--display); font-size: 3.2cqw; color: var(--muted); letter-spacing: .05em;
}
.token {
  position: absolute; width: 5.6cqw; height: 5.6cqw; border-radius: 50%;
  background: var(--c); border: .55cqw solid var(--panel);
  box-shadow: 0 .5cqw 1cqw rgba(0,0,0,.35);
  transform: translate(calc(-50% + var(--dx, 0) * 100%), calc(-50% + var(--dy, 0) * 100%));
  transition: left .16s ease-out, top .16s ease-out, transform .2s;
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 2.4cqw; z-index: 2;
}
.token.slide { transition: left .8s cubic-bezier(.5,0,.3,1), top .8s cubic-bezier(.5,0,.3,1); }
.token.active { z-index: 3; outline: .5cqw solid var(--c); outline-offset: .4cqw; }

/* Side column */
.side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1 {
  font-family: var(--display); font-weight: 400; font-size: 40px; line-height: .95; margin: 0;
  text-wrap: balance; letter-spacing: .01em;
}
h1 span { color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.turn { display: flex; gap: 16px; align-items: center; }
.status { flex: 1; min-width: 0; }
.status b { display: block; font-size: 18px; }
.status small { color: var(--muted); font-size: 13px; }
.die {
  width: 84px; height: 84px; border-radius: 18px; border: 3px solid var(--ink); background: var(--tile-a);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  padding: 12px; gap: 3px; cursor: pointer; flex: none; box-shadow: 0 4px 0 var(--ink);
  transition: transform .1s, box-shadow .1s;
}
.die:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.die:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.die:disabled { cursor: default; opacity: .75; }
.die:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.die.rolling { animation: wobble .12s linear infinite; }
@keyframes wobble { 0% { rotate: -8deg; } 50% { rotate: 8deg; } 100% { rotate: -8deg; } }
.pip { border-radius: 50%; background: transparent; }
.pip.on { background: var(--ink); }
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.players li {
  display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px;
}
.players li.now { background: var(--bg); }
.dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); }
.pname { font-weight: 700; overflow-wrap: anywhere; }
.pname em { font-style: normal; color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
.ppos { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--muted); }
.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin: 0 0 10px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow: auto; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log li { display: flex; gap: 8px; align-items: baseline; }
.log li .dot { width: 10px; height: 10px; flex: none; }
.log .snake { color: #c2413a; font-weight: 700; }
.log .ladder { color: var(--ladder); font-weight: 700; }
.setup { display: flex; flex-direction: column; gap: 10px; }
.setup .row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 110px; gap: 8px; align-items: center; }
input[type="text"], select {
  font: inherit; color: var(--ink); background: var(--tile-a); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0;
}
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.btn {
  font: inherit; font-weight: 800; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.winner {
  position: absolute; inset: 0 0 auto 0; height: calc(100% * 10 / 11); display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 70%, transparent); z-index: 5; border-radius: 14px;
}
.winner div { text-align: center; background: var(--panel); border: 3px solid var(--ink); border-radius: 18px; padding: 5cqw 7cqw; }
.winner h2 { font-family: var(--display); font-weight: 400; font-size: 7cqw; margin: 0 0 1cqw; color: var(--c); }
.winner p { margin: 0 0 3cqw; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .token, .token.slide { transition-duration: .05s; }
  .die.rolling { animation: none; }
  .sq.flash { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <div class="board-wrap" id="wrap">
    <div class="board" id="board"></div>
    <svg class="overlay" id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="strip">START · 0</div>
    <div class="winner" id="winner" hidden><div><h2 id="winName"></h2><p id="winText"></p><button class="btn" id="again">Play again</button></div></div>
  </div>

  <aside class="side">
    <div>
      <h1>Snakes <span>&amp;</span> Ladders</h1>
      <p class="sub">Everyone starts at 0. First to land on 100 wins.</p>
    </div>

    <section class="card turn" aria-live="polite">
      <div class="status"><b id="turnName"></b><small id="turnHint"></small></div>
      <button class="die" id="die" aria-label="Roll the die"></button>
    </section>

    <section class="card">
      <p class="label">Players</p>
      <ul class="players" id="players"></ul>
    </section>

    <section class="card">
      <p class="label">Moves</p>
      <ol class="log" id="log"></ol>
    </section>

    <section class="card setup">
      <p class="label" style="margin:0">New game</p>
      <label class="check">Players
        <select id="count" style="width:auto"><option>2</option><option>3</option><option>4</option></select>
      </label>
      <div id="setupRows" class="setup"></div>
      <label class="check"><input type="checkbox" id="optBounce" checked> Bounce back if you overshoot 100</label>
      <label class="check"><input type="checkbox" id="optSix" checked> Roll a 6, roll again</label>
      <div class="btns"><button class="btn" id="start">Start new game</button></div>
    </section>
  </aside>
</div>

<script>
const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
const SNAKES  = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
const COLORS = ["#d8403a", "#2f62e0", "#e2a516", "#2e9a5c"];
const SNAKE_COLORS = [["#3c8d4e", "#a8d86a"], ["#c2413a", "#f3a26b"], ["#7a4ba0", "#d5a4f0"], ["#c97d14", "#f6d66b"], ["#22808f", "#8fe0d6"]];
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 60) : ms));

let state, busy = false, cpuTimer = null, setup = [
  { name: "You", type: "human" }, { name: "Computer", type: "cpu" },
  { name: "Player 3", type: "human" }, { name: "Player 4", type: "cpu" }
];

function cell(n) {
  const r = Math.floor((n - 1) / 10);
  let c = (n - 1) % 10;
  if (r % 2) c = 9 - c;
  return { r, c, x: c * 10 + 5, y: (9 - r) * 10 + 5 };
}

/* ---------- Board drawing ---------- */
function buildBoard() {
  const board = $("board");
  board.innerHTML = "";
  for (let n = 1; n <= 100; n++) {
    const { r, c } = cell(n);
    const d = document.createElement("div");
    d.className = "sq" + ((r + c) % 2 ? " alt" : "") + (n === 100 ? " home" : "");
    d.id = "sq" + n;
    d.style.gridRow = 10 - r;
    d.style.gridColumn = c + 1;
    d.textContent = n;
    board.appendChild(d);
  }
  const ns = "http://www.w3.org/2000/svg";
  const svg = $("overlay");
  svg.innerHTML = "";
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  // Ladders
  for (const [from, to] of Object.entries(LADDERS)) {
    const a = cell(+from), b = cell(to);
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, nx = -uy * 2.3, ny = ux * 2.3;
    const g = el("g", { "stroke-linecap": "round" });
    for (const [off, col] of [[0.7, "var(--ladder-shadow)"], [0, "var(--ladder)"]]) {
      const s = `stroke:${col}`;
      for (const sgn of [-1, 1]) {
        el("line", { x1: a.x + nx * sgn + off, y1: a.y + ny * sgn + off, x2: b.x + nx * sgn + off, y2: b.y + ny * sgn + off, "stroke-width": 1.1, style: s }, g);
      }
      const rungs = Math.max(2, Math.floor(len / 4.2));
      for (let i = 1; i < rungs; i++) {
        const t = i / rungs, cx = a.x + dx * t + off, cy = a.y + dy * t + off;
        el("line", { x1: cx - nx, y1: cy - ny, x2: cx + nx, y2: cy + ny, "stroke-width": 0.85, style: s }, g);
      }
    }
  }

  // Snakes
  Object.entries(SNAKES).forEach(([from, to], i) => {
    const h = cell(+from), t = cell(to);
    const dx = t.x - h.x, dy = t.y - h.y, len = Math.hypot(dx, dy);
    const px = -dy / len, py = dx / len;
    const waves = Math.max(1.5, Math.round(len / 16) + 0.5);
    const amp = Math.min(4.2, 1.5 + len * 0.05);
    const N = 48, pts = [];
    for (let k = 0; k <= N; k++) {
      const s = k / N, w = Math.sin(s * waves * Math.PI * 2) * amp * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, s * 1.1)));
      pts.push([h.x + dx * s + px * w, h.y + dy * s + py * w]);
    }
    const [body, belly] = SNAKE_COLORS[i % SNAKE_COLORS.length];
    const g = el("g", { "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" });
    for (let k = 0; k < N; k++) {
      const s = k / N;
      el("line", { x1: pts[k][0], y1: pts[k][1], x2: pts[k + 1][0], y2: pts[k + 1][1], stroke: body, "stroke-width": 3.4 * (1 - s) + 0.7 * s }, g);
    }
    el("path", { d: "M" + pts.slice(2, N - 4).map(p => p.join(" ")).join(" L"), stroke: belly, "stroke-width": 0.75, "stroke-dasharray": "1.2 1.4" }, g);
    const ang = Math.atan2(pts[0][1] - pts[2][1], pts[0][0] - pts[2][0]) * 180 / Math.PI;
    const head = el("g", { transform: `translate(${pts[0][0]} ${pts[0][1]}) rotate(${ang})` }, g);
    el("path", { d: "M2.6 0 l1.3 0 l.6 -.5 M3.9 0 l.6 .5", stroke: "#e0302a", "stroke-width": 0.3 }, head);
    el("ellipse", { cx: 0.4, cy: 0, rx: 2.6, ry: 2.1, fill: body }, head);
    for (const sy of [-1, 1]) {
      el("circle", { cx: 1.1, cy: sy * 0.95, r: 0.62, fill: "#ffffff" }, head);
      el("circle", { cx: 1.3, cy: sy * 0.95, r: 0.3, fill: "#111111" }, head);
    }
  });
}

/* ---------- Game state ---------- */
function newGame() {
  clearTimeout(cpuTimer);
  busy = false;
  const count = +$("count").value;
  state = {
    players: setup.slice(0, count).map((p, i) => ({ name: p.name.trim() || `Player ${i + 1}`, type: p.type, color: COLORS[i], pos: 0 })),
    turn: 0, last: null, winner: null, log: [],
    bounce: $("optBounce").checked, six: $("optSix").checked
  };
  document.querySelectorAll(".token").forEach(t => t.remove());
  state.players.forEach((p, i) => {
    const t = document.createElement("div");
    t.className = "token";
    t.id = "tok" + i;
    t.textContent = i + 1;
    t.style.setProperty("--c", p.color);
    $("wrap").appendChild(t);
  });
  render();
  maybeCpu();
}

function placeTokens() {
  const groups = {};
  state.players.forEach((p, i) => (groups[p.pos] ??= []).push(i));
  const offs = [[0, 0], [[-0.3, 0], [0.3, 0]], [[-0.3, -0.25], [0.3, -0.25], [0, 0.3]], [[-0.3, -0.3], [0.3, -0.3], [-0.3, 0.3], [0.3, 0.3]]];
  state.players.forEach((p, i) => {
    const t = $("tok" + i);
    let x, y;
    if (p.pos === 0) { x = i * 8 + 5; y = 10.5 / 11 * 100; }
    else { const c = cell(p.pos); x = c.x; y = c.y * 10 / 11; }
    const g = groups[p.pos], k = g.indexOf(i);
    const o = p.pos === 0 || g.length === 1 ? [0, 0] : offs[g.length - 1][k];
    t.style.left = x + "%";
    t.style.top = y + "%";
    t.style.setProperty("--dx", o[0]);
    t.style.setProperty("--dy", o[1]);
    t.classList.toggle("active", i === state.turn && !state.winner);
  });
}

function renderDie(v) {
  const d = $("die");
  d.innerHTML = "";
  const on = PIPS[v || 1];
  for (let i = 0; i < 9; i++) {
    const s = document.createElement("span");
    s.className = "pip" + (on.includes(i) ? " on" : "");
    d.appendChild(s);
  }
}

function render() {
  placeTokens();
  const cur = state.players[state.turn];
  if (state.winner != null) {
    const w = state.players[state.winner];
    $("turnName").textContent = `${w.name} won!`;
    $("turnHint").textContent = "Start a new game to play again.";
  } else {
    $("turnName").textContent = cur.type === "cpu" ? `${cur.name} is rolling…` : `${cur.name}'s turn`;
    $("turnHint").textContent = cur.type === "cpu" ? "Computer player" : "Click the die or press Space";
  }
  $("turnName").style.color = (state.winner != null ? state.players[state.winner] : cur).color;
  $("die").disabled = busy || state.winner != null || cur.type === "cpu";
  if (!busy) renderDie(state.last);

  $("players").innerHTML = state.players.map((p, i) =>
    `<li class="${i === state.turn && state.winner == null ? "now" : ""}" style="--c:${p.color}">
      <span class="dot"></span>
      <span class="pname">${esc(p.name)}<em>${p.type === "cpu" ? "computer" : ""}</em></span>
      <span class="ppos">${p.pos === 0 ? "Start" : p.pos}</span></li>`).join("");

  $("log").innerHTML = state.log.length
    ? state.log.map(e => `<li style="--c:${e.color}"><span class="dot"></span><span>${e.html}</span></li>`).join("")
    : `<li><span style="color:var(--muted)">No moves yet. Roll the die to begin.</span></li>`;

  const win = $("winner");
  win.hidden = state.winner == null;
  if (state.winner != null) {
    const w = state.players[state.winner];
    win.style.setProperty("--c", w.color);
    $("winName").textContent = `${w.name} wins!`;
    $("winText").textContent = `Reached 100 after ${state.log.filter(e => e.p === state.winner && e.roll).length} rolls.`;
  }
  try { localStorage.setItem("sl-setup", JSON.stringify({ setup, count: $("count").value })); } catch {}
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function log(i, html, roll) {
  state.log.unshift({ p: i, color: state.players[i].color, html, roll });
  state.log.length = Math.min(state.log.length, 60);
}

async function roll() {
  if (busy || state.winner != null) return;
  busy = true;
  render();
  const die = $("die");
  die.classList.add("rolling");
  for (let k = 0; k < 8; k++) { renderDie(1 + Math.floor(Math.random() * 6)); await sleep(70); }
  die.classList.remove("rolling");
  const v = 1 + Math.floor(Math.random() * 6);
  state.last = v;
  renderDie(v);
  await sleep(250);

  const i = state.turn, p = state.players[i], start = p.pos;
  const name = `<b>${esc(p.name)}</b>`;
  let target = start + v, path = [];
  if (target > 100 && !state.bounce) {
    log(i, `${name} rolled ${v} but needs exactly ${100 - start}. Stays on ${start || "Start"}.`, true);
  } else {
    for (let s = start + 1; s <= Math.min(target, 100); s++) path.push(s);
    if (target > 100) { for (let s = 99; s >= 200 - target; s--) path.push(s); target = 200 - target; }
    for (const s of path) { p.pos = s; placeTokens(); await sleep(170); }
    let msg = `${name} rolled ${v}: ${start || "Start"} → ${target}`;
    if (start + v > 100) msg += " (bounced back)";
    const jump = LADDERS[target] ?? SNAKES[target];
    if (jump) {
      await sleep(200);
      const tok = $("tok" + i);
      tok.classList.add("slide");
      p.pos = jump;
      placeTokens();
      await sleep(850);
      tok.classList.remove("slide");
      msg += LADDERS[target] ? `, <span class="ladder">climbed a ladder to ${jump}</span>` : `, <span class="snake">bitten by a snake, down to ${jump}</span>`;
    }
    const sq = $("sq" + p.pos);
    if (sq) { sq.classList.remove("flash"); void sq.offsetWidth; sq.classList.add("flash"); }
    log(i, msg + ".", true);
  }

  if (p.pos === 100) state.winner = i;
  else if (!(v === 6 && state.six)) state.turn = (state.turn + 1) % state.players.length;
  else log(i, `${name} rolled a 6 and goes again.`);
  busy = false;
  render();
  maybeCpu();
}

function maybeCpu() {
  clearTimeout(cpuTimer);
  if (state.winner == null && state.players[state.turn].type === "cpu") cpuTimer = setTimeout(roll, 750);
}

/* ---------- Setup panel ---------- */
function renderSetup() {
  const n = +$("count").value;
  $("setupRows").innerHTML = setup.slice(0, n).map((p, i) => `
    <div class="row">
      <span class="dot" style="--c:${COLORS[i]}"></span>
      <input type="text" id="name${i}" value="${esc(p.name)}" maxlength="18" aria-label="Player ${i + 1} name">
      <select id="type${i}" aria-label="Player ${i + 1} type">
        <option value="human"${p.type === "human" ? " selected" : ""}>Human</option>
        <option value="cpu"${p.type === "cpu" ? " selected" : ""}>Computer</option>
      </select>
    </div>`).join("");
  for (let i = 0; i < n; i++) {
    $("name" + i).addEventListener("input", e => { setup[i].name = e.target.value; });
    $("type" + i).addEventListener("change", e => { setup[i].type = e.target.value; });
  }
}

/* ---------- Boot ---------- */
function start(saved) {
  try {
    const s = JSON.parse(localStorage.getItem("sl-setup"));
    if (s?.setup?.length === 4) { setup = s.setup; $("count").value = s.count; }
  } catch {}
  buildBoard();
  renderSetup();
  $("count").addEventListener("change", renderSetup);
  $("die").addEventListener("click", roll);
  $("start").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  document.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && !e.target.closest("input, select, button")) {
      e.preventDefault();
      if (!$("die").disabled) roll();
    }
  });
  if (saved?.state) {
    state = saved.state;
    const players = state.players;
    newGameTokens(players);
    render();
    maybeCpu();
  } else newGame();
  window.claude?.hot?.snapshot?.(() => ({ state }));
}
function newGameTokens(players) {
  document.querySelectorAll(".token").forEach(t => t.remove());
  players.forEach((p, i) => {
    const t = document.createElement("div");
    t.className = "token"; t.id = "tok" + i; t.textContent = i + 1;
    t.style.setProperty("--c", p.color);
    $("wrap").appendChild(t);
  });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
